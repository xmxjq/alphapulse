services:
  crawler:
    build:
      context: .
      dockerfile: docker/crawler/Dockerfile
    restart: unless-stopped
    working_dir: /app
    command: ["uv", "run", "alphapulse", "--config", "/app/settings.toml", "run"]
    volumes:
      - ./:/app
      - ./.runtime/bilibili-cli:/root/.bilibili-cli
    environment:
      PYTHONUNBUFFERED: "1"
  web:
    build:
      context: .
      dockerfile: docker/crawler/Dockerfile
    restart: unless-stopped
    working_dir: /app
    command: ["uv", "run", "alphapulse", "--config", "/app/settings.toml", "web", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
  # Persistent Chromium session for authenticated guba post-detail crawling.
  # The noVNC port is loopback-only; reach it through an SSH tunnel:
  #   ssh -L 6080:127.0.0.1:6080 <worker>
  # then open http://127.0.0.1:6080/vnc.html?autoconnect=1&resize=scale.
  guba_browser:
    build:
      context: .
      dockerfile: docker/guba-browser/Dockerfile
    restart: unless-stopped
    profiles: ["guba-browser"]
    command: ["/usr/local/bin/start-guba-browser"]
    volumes:
      - ./.runtime/guba-browser-profile:/data/profile
    ports:
      - "127.0.0.1:6080:6080"
    expose:
      - "9223"
    environment:
      GUBA_BROWSER_PROXY: "http://host.docker.internal:10809"
      GUBA_BROWSER_START_URL: "https://guba.eastmoney.com/"
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9222/json/version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  # Local xray client exposing one HTTP-proxy inbound per tunnel; pair with
  # crawl.proxy.provider = "static_list" in settings.toml, e.g.
  #   crawl.static_proxies.urls = ["http://host.docker.internal:10809"]
  # Config is untracked:
  #   cp xray/config.example.json xray/config.json   # then fill in your servers
  #   docker compose --profile xray up -d xray
  xray:
    image: teddysun/xray:latest
    restart: unless-stopped
    profiles: ["xray"]
    ports:
      - "10809:10809"
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
  proxy_pool:
    image: jhao104/proxy_pool:latest
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "5010:5010"
    depends_on:
      - proxy_redis
    environment:
      DB_CONN: "redis://@proxy_redis:6379/0"
  proxy_redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["proxy"]
