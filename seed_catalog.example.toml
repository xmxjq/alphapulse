[[logical_sets]]
name = "cn-core"
generators = ["cn-core-manual", "guba-hot"]

# 淘股吧 daily set: featured + general feeds + self-discovered hot-stock boards.
[[logical_sets]]
name = "tgb-daily"
generators = ["tgb-hot"]

[[generators]]
name = "cn-core-manual"
type = "manual"
discover_homepage = true
bilibili_video_targets = ["BV1xx411c7mu"]
# UP主 space pages — each expands into a fetch_post task per published video.
# Accepts full URLs (https://space.bilibili.com/<mid>) or bare numeric mids.
bilibili_space_urls = ["https://space.bilibili.com/7033507"]
post_urls = []
# Manual Guba boards are optional now that guba-hot seeds boards automatically;
# keep any you always want crawled. Bare stock codes ("600519") or index
# codes ("zssh000001").
guba_board_codes = []
stock_ids = ["SH600519", "SZ000858"]
topic_ids = ["新能源"]
user_ids = []

# Guba day crawl: seeds boards from the three homepage rankings — 热门个股吧,
# 热门概念吧, 热门主题吧 (top `hot_boards_per_section`, configured under
# [sources.guba]). Theme entries expand into their constituent concept (BK)
# boards. Each refresh also snapshots the day's ranking for the /report page.
[[generators]]
name = "guba-hot"
type = "guba_hot_boards"
# Optional: restrict to a subset. Defaults to all three.
# sections = ["hot_stock", "hot_concept", "hot_theme"]

# 淘股吧 hot boards: always seeds 精华 (featured) + 社区总版 (general), plus the
# top-N 热门研股 hot-stock boards discovered from the homepage. Each refresh also
# snapshots the day's Featured/General ranking for the /report/tgb page.
[[generators]]
name = "tgb-hot"
type = "tgb_hot_boards"
# include_featured = true
# include_general = true
# include_fixed_boards = true
# hot_stocks_limit = 12   # overrides sources.tgb.hot_stocks_limit
