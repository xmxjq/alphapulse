[storage]
backend = "rqlite"

[clickhouse]
url = "http://clickhouse:8123"
database = "alphapulse"
username = "default"
password = ""
secure = false

[rqlite]
url = "http://remote-rqlite.example.com:4001"
username = ""
password = ""
queue_writes = true
queue_timeout_seconds = 10

[mongo]
# Only used when storage.backend = "mongo". State (url_state, seed_sets, etc.)
# continues to live in rqlite/sqlite; only posts/comments/authors/crawl_runs
# move to MongoDB.
uri = "mongodb://localhost:27017"
database = "alphapulse"
# Set this when sharing a database with other apps. Actual collections become
# "{collection_prefix}{posts_collection}", e.g. "alphapulse_posts".
collection_prefix = ""
authors_collection = "authors"
posts_collection = "posts"
comments_collection = "comments"
crawl_runs_collection = "crawl_runs"
crawl_errors_collection = "crawl_errors"
server_selection_timeout_ms = 5000

[crawl]
# state_backend: "sqlite" (local file, single instance) or "rqlite" (shared, safe for multiple instances)
state_backend = "sqlite"
state_path = ".runtime/state.db"
poll_interval_seconds = 300
request_timeout_seconds = 30
post_recrawl_minutes = 360
comment_refresh_minutes = 60
concurrent_requests = 4
log_level = "INFO"
user_agent = "AlphaPulseBot/0.1 (+https://github.com/xmxjq/alphapulse)"

[crawl.proxy]
enabled = false
# provider: "proxy_pool" (rotating public proxies via the proxy_pool service),
# "static_list" (fixed upstreams from [crawl.static_proxies], e.g. xray
# tunnels — see docs/xray-proxy.md), or "kuaidaili" (private GetDPS API).
# provider = "static_list"
max_attempts = 2
fail_open = false
# Restrict which sources go through the proxy; empty = all sources. Keep
# cookie-authenticated sources (bilibili, xueqiu) OFF rotating exits — the
# same session hopping between IPs is a fast path to an account ban.
sources = []

[crawl.proxy_pool]
base_url = "http://proxy_pool:5010"
https_only = true
acquire_timeout_seconds = 3
report_bad_on_block = true

[crawl.static_proxies]
# Fixed proxy endpoints rotated round-robin, e.g. one HTTP inbound per xray
# tunnel (see xray/config.example.json and the compose "xray" profile).
# A proxy that returns a blocked/failed response sits out cooldown_seconds.
urls = []
# urls = ["http://xray:10809", "http://xray:10810"]
cooldown_seconds = 300

[crawl.kuaidaili]
# Store the generated GetDPS URL in this ignored file. Never commit the URL.
api_url_file = ".runtime/kuaidaili-api-url.txt"
metrics_path = ".runtime/proxy-metrics.db"
batch_size = 5
low_watermark = 2
lease_ttl_seconds = 600
cooldown_seconds = 600
acquire_timeout_seconds = 20
# Transient transport failures keep using the same paid IP until this many
# consecutive failures. Explicit blocks and proxy setup failures bench it now.
failure_threshold = 3

[crawl.agent_pool]
# Self-hosted outbound fetch agents. Agents make outbound HTTPS connections to
# this worker's Web API, so neither the worker nor home/VPS nodes need inbound
# ports. Create one credential per node with:
#   uv run alphapulse --config settings.toml agent-token create --agent-id home-arm
enabled = false
db_path = ".runtime/agent-pool.db"
sources = ["guba", "tgb"]
strategy = "agent_first"
heartbeat_ttl_seconds = 90
lease_seconds = 180
queue_wait_seconds = 10
job_wait_seconds = 120
result_poll_interval_seconds = 0.5
blocked_cooldown_seconds = 21600
max_response_bytes = 8000000
max_pending_jobs = 10000
response_body_retention_hours = 24
job_metadata_retention_days = 30
# When no suitable agent is online, continue through the configured paid proxy
# or direct transport instead of stopping the source.
fallback_to_existing_transport = true
# Both the worker and agent binary enforce this exact hostname allowlist.
allowed_hosts = [
  "guba.eastmoney.com",
  "emappdata.eastmoney.com",
  "push2.eastmoney.com",
  "www.tgb.cn",
]

[crawl.raw_store]
# Disk archive of raw HTTP responses: gzip blobs content-addressed by sha256
# under {root_path}/blobs plus a {root_path}/fetch_log.db SQLite index that
# records status, timing, content hash, block classification, and parser
# errors per fetch. Used by sources.guba for debugging and reprocessing.
enabled = false
root_path = ".runtime/raw"
compress = true

[sources.xueqiu]
enabled = true
base_url = "https://xueqiu.com"
fetch_mode = "static"
homepage_discovery_urls = ["https://xueqiu.com"]
comments_api_template = "https://xueqiu.com/statuses/comments.json?id={post_id}&count={page_size}&page={page}"
seed_catalog_path = "seed_catalog.example.toml"
seed_refresh_minutes = 60
generated_seed_ttl_minutes = 1440

[sources.xueqiu.cookies]
# xq_a_token = ""
# xqat = ""

[sources.bilibili]
enabled = true
api_base_url = "https://api.bilibili.com"
web_base_url = "https://www.bilibili.com"
sort_mode = 3
page_size = 30
max_pages = 1000
space_discovery_backend = "api"
space_discovery_interval_minutes = 60
space_discovery_max_videos = 50
# Per-request jitter in seconds. Each request sleeps a uniform random value in
# [min, max] before firing. Keep this conservative when using an authenticated
# cookie — fast, regular cadence is the fastest way to get the account banned.
request_interval_min_seconds = 2.0
request_interval_max_seconds = 5.0

[sources.bilibili.cookies]
# SESSDATA = ""

[sources.guba]
# Eastmoney Guba (东方财富股吧). Boards are seeded automatically by the
# `guba_hot_boards` generator (see seed_catalog.example.toml) from the three
# homepage rankings; you may also pin boards manually via guba_board_codes.
enabled = false
base_url = "https://guba.eastmoney.com"
# Per-board list-page cap (80 posts/page). In day_scoped mode a board stops at
# whichever comes first: the day boundary (a page with no post still active
# today) or this many pages. Keep it modest so one crawl cycle finishes well
# within a day — that's what lets seeds and the daily ranking snapshot refresh
# each day. Raise only alongside more proxy throughput.
max_list_pages = 3
reply_page_size = 30
# Daily reports only need the newest reply page. Raise this for explicit
# historical backfills that need complete reply threads.
max_reply_pages = 1
# Post-only mode: set false to skip reply/comment crawling entirely (no
# refresh_comments tasks at all) when a full crawl can't finish within a day.
# Unlike max_reply_pages, which only limits pagination depth on threads that
# are fetched, this stops comment fetching outright.
fetch_comments = true
list_recrawl_minutes = 30
# Day-grouped crawl: only publish posts from the current day (in ranking_timezone)
# and paginate to that day's boundary. Set false for the classic fixed-page crawl.
day_scoped = true
ranking_timezone = "Asia/Shanghai"
# Top-N boards taken from each homepage ranking ("the render part", ~12).
hot_boards_per_section = 12
# Deprecated/unused (kept so older configs still load). 热门主题吧 entries are
# whole boards now, not themes with member baskets.
# theme_member_cap = 8
# Ranking data sources (stable public East Money endpoints). Override only if
# East Money changes them.
# ranking_stock_url = "https://emappdata.eastmoney.com/stockrank/getAllCurrentList"
# ranking_concept_url = "https://push2.eastmoney.com/api/qt/clist/get?...dpt=gb.rmbk..."
# ranking_theme_url = "https://guba.eastmoney.com/api/getBulletin?url=html%2FBase%2F1346.html&cachetime=600"
# Per-request jitter in seconds; every request sleeps uniform(min, max) times
# an adaptive backoff multiplier before firing. No login or cookies required.
request_interval_min_seconds = 2.0
request_interval_max_seconds = 6.0
# Hybrid guba mode runs these paid-proxy and self-hosted-agent request slots
# together. Agent slots shrink automatically to current online capacity.
concurrent_paid_requests = 1
concurrent_agent_requests = 4
max_retries = 3
# Stop all guba work after a blocked response and retry after this cooldown.
block_cooldown_seconds = 21600
# user_agent = "Mozilla/5.0 ..."  # defaults to a desktop browser UA

[sources.guba.cookies]

[sources.guba.browser]
# Use the persistent worker Chromium session for post-detail pages only.
# Start it with:
#   docker compose --profile guba-browser up -d guba_browser
# Log in through the SSH-tunneled noVNC page before enabling this setting.
enabled = false
cdp_url = "http://guba_browser:9223"
navigation_timeout_seconds = 60
settle_timeout_seconds = 15
# Full browser navigations are much heavier than HTTP/API requests.
request_interval_min_seconds = 30.0
request_interval_max_seconds = 90.0
max_posts_per_cycle = 40

[sources.tgb]
# 淘股吧 (tgb.cn). Boards are seeded automatically by the `tgb_hot_boards`
# generator (see seed_catalog.example.toml): the 精华 (featured) and 社区总版
# (general) feeds are always on, and hot-stock boards are self-discovered from
# the homepage 热门研股 widget. tgb.cn is server-rendered HTML and (from AWS)
# reachable only through a proxy — configure [crawl.proxy]/static_proxies.
enabled = false
base_url = "https://www.tgb.cn"
# Board slugs for the two fixed feeds (the report's Featured / General sections).
featured_slug = "jinghua"
general_slug = "zongban"
# Per-board list-page cap for the day-scoped feed crawl (~70 posts/page). Keep
# modest so one cycle finishes within a day and each day gets its own snapshot.
max_list_pages = 3
# Per-stock discussion boards render one server-side page of the mention feed.
max_stock_pages = 1
# Top-N 热门研股 (hot research stocks) seeded as "general" boards each day.
hot_stocks_limit = 12
list_recrawl_minutes = 30
# Day-grouped crawl: only today's posts (feeds sorted by post date descending).
day_scoped = true
ranking_timezone = "Asia/Shanghai"
# Homepage carrying the 热门研股 widget; parsed for hot-stock discovery.
# ranking_hot_stock_url = "https://www.tgb.cn/"
# Per-request jitter in seconds × an adaptive backoff multiplier. No login needed.
request_interval_min_seconds = 2.0
request_interval_max_seconds = 6.0
max_retries = 3
# user_agent = "Mozilla/5.0 ..."  # defaults to a desktop browser UA

[sources.tgb.cookies]

[web]
# Bind address for `alphapulse web`. Default to loopback; expose intentionally.
host = "127.0.0.1"
port = 8000
